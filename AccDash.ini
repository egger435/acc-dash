; AccDash.ini - ACC Telemetry Dashboard
; Numbers only, no units.  Changes apply after restart.

[display]
; seconds of history drawn in the two centre charts (3..60)
TraceSeconds=10
; speed tile unit: kmh | mph
SpeedUnit=kmh
; temperature unit: c | f
TempUnit=c
; G-G circle full scale (g)
GScale=2.0

[video]
; record one clip per lap and store it inside the lap file
Video=1
; clip size in pixels and frame rate (160..1280 x 90..720, 5..60 fps)
VideoW=320
VideoH=180
VideoFps=24
; how often the screen is grabbed (5..30).  A lower rate costs the
; game much less; frames are repeated to keep VideoFps in the file
grab fps=24
; x264 quality, 16 (best, big) .. 34 (small)
VideoCrf=26
; ffmpeg.exe to use; empty = ffmpeg.exe or ffmpeg\bin\ffmpeg.exe next to
; AccDash.exe (default), then PATH
FfmpegPath=
; force the capture region, x,y,w,h; empty = follow the game window
VideoArea=
; force the ddagrab output (screen) index; -1 = follow the game window
VideoOutput=-1
